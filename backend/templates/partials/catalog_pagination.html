{% if page_obj.has_other_pages %}<nav class="action-row" aria-label="Seiten">
{% if page_obj.has_previous %}<a class="aw-button aw-button--outline" href="?page={{ page_obj.previous_page_number }}">Zurück</a>{% endif %}
<span>Seite {{ page_obj.number }} von {{ page_obj.paginator.num_pages }}</span>
{% if page_obj.has_next %}<a class="aw-button aw-button--outline" href="?page={{ page_obj.next_page_number }}">Weiter</a>{% endif %}
</nav>{% endif %}
