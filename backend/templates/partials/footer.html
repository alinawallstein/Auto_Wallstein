{% load static %}
<footer class="main-footer">
    <div class="footer-container">
        <div class="footer-section">
            <p class="footer-text">
                © {% now "Y" %} <strong>{{ site_content.business_name }}</strong> — {{ site_content.street }}, {{ site_content.city }}
            </p>
                <nav class="footer-links" aria-label="Weiterführende Seiten">
                    <a href="{% url 'public_accessories' %}">Teile & Zubehör</a>
                    <a href="{% url 'public_news' %}">Neuigkeiten</a>
                    <a href="{% url 'impressum' %}">Impressum</a>
                    <span class="divider" aria-hidden="true">|</span>
                    <a href="{% url 'datenschutz' %}">Datenschutz</a>
                    <span class="divider" aria-hidden="true">|</span>
                    <a href="{% url 'kontakt' %}">Kontakt</a>
                    <span class="divider" aria-hidden="true">|</span>
                    <a href="{% url 'oeffnungszeiten' %}">Öffnungszeiten</a>
                </nav>
                <p class="footer-ctas">
                    <a href="tel:{{ site_content.phone|cut:' ' }}" aria-label="Auto Wallstein anrufen: {{ site_content.phone }}"><img src="{% static 'images/icons/phone.svg' %}" alt="" class="icon-svg"/></a>
                    <a href="mailto:{{ site_content.email }}" aria-label="E-Mail an Auto Wallstein schreiben: {{ site_content.email }}"><img src="{% static 'images/icons/mail.svg' %}" alt="" class="icon-svg"/></a>
                </p>
        </div>
        <div class="footer-bottom">
            <p class="footer-dev">
                Design und Entwicklung by <span>Alina Wallstein</span>
            </p>
        </div>
    </div>
</footer>
