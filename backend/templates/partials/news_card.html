<article class="vehicle-card">{% if article.image %}<img class="vehicle-card__image" src="{{ article.image.url }}" alt="{{ article.image_alt|default:article.title }}" width="800" height="500" loading="lazy">{% endif %}<div class="vehicle-card__body">{% if heading_level == "h3" %}<h3 class="vehicle-card__title">{{ article.title }}</h3>{% else %}<h2 class="vehicle-card__title">{{ article.title }}</h2>{% endif %}<p>{{ article.excerpt }}</p><a href="{% url 'news_detail' article.pk %}">Beitrag lesen</a></div></article>
