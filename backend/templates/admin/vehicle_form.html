<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Auto Wallstein</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar">
        <div class="logo">
            <a href="{% url 'dashboard' %}" aria-label="Zum Dashboard">
                <img src="{% static 'images/logo.png' %}" alt="Auto Wallstein Logo">
            </a>
        </div>
        <div class="ms-auto">
            <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">Logout</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">{{ title }}</h1>
            <a class="btn btn-outline-secondary" href="{% url 'dashboard' %}">Zurück</a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="row g-3">
                        {% for field in form %}
                            <div class="col-md-6">
                                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                                {{ field }}
                                {% if field.errors %}
                                    <div class="text-danger small mt-1">{{ field.errors|join:", " }}</div>
                                {% endif %}
                            </div>
                        {% endfor %}
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Speichern</button>
                        <a class="btn btn-outline-secondary" href="{% url 'dashboard' %}">Abbrechen</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
