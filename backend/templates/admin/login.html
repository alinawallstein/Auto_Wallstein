<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Auto Wallstein</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #091016 0%, #101820 100%);
            color: #f3f6f9;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-shell {
            width: min(460px, calc(100% - 24px));
        }
        .login-card {
            background: rgba(12, 18, 22, 0.96);
            border: 1px solid rgba(189, 205, 220, 0.22);
            border-radius: 20px;
            box-shadow: 0 20px 55px rgba(0,0,0,0.32), 0 0 0 1px rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
        }
        .login-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .login-brand img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }
        .login-card .form-label,
        .login-card label,
        .login-card p,
        .login-card .helptext {
            color: #edf3f8;
        }
        .login-card input {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            color: #f3f6f9;
        }
        .login-card input:focus {
            background: rgba(255,255,255,0.02);
            border-color: rgba(220,227,235,0.6);
            box-shadow: 0 0 0 0.2rem rgba(223,229,235,0.12);
            color: #f3f6f9;
        }
        .login-card .btn-primary {
            background: linear-gradient(135deg, rgba(223,229,235,0.96), rgba(185,195,204,0.88));
            border: none;
            color: #101820;
            font-weight: 700;
        }
        .login-card .alert-danger {
            background: rgba(220,53,69,0.14);
            border-color: rgba(220,53,69,0.3);
            color: #ffdfe3;
        }
    </style>
</head>
<body>
    <div class="login-shell">
        <div class="card login-card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <div class="login-brand">
                    <img src="/static/images/logo.png" alt="Auto Wallstein Logo">
                    <span>Auto Wallstein</span>
                </div>
                <h1 class="h3 mb-4 text-center">Händlerbereich</h1>

                {% if form.errors %}
                    <div class="alert alert-danger">Bitte überprüfe Benutzername und Passwort.</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Anmelden</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
