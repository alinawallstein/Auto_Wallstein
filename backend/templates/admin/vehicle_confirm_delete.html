<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahrzeug löschen | Auto Wallstein</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card border-0 shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Fahrzeug löschen</h1>
                <p>Möchtest du folgendes Fahrzeug wirklich löschen?</p>
                <p class="fw-bold mb-4">{{ vehicle.brand }} {{ vehicle.model }} ({{ vehicle.internal_number }})</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Ja, löschen</button>
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Abbrechen</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
