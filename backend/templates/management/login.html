{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Auto Wallstein</title>
    <script src="{% static 'js/theme.js' %}?v=system-2"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}?v=admin-1">
    <link rel="stylesheet" href="{% static 'css/dark-mode.css' %}?v=matching-nav-6">
    <link rel="stylesheet" href="{% static 'css/management-theme.css' %}?v=1">
</head>
<body class="management-login">
    <main class="login-shell">
        <a href="{% url 'home' %}" class="login-brand"><img src="{% static 'images/logo.png' %}" width="200" alt="Auto Wallstein – Startseite"></a>
        <p class="login-eyebrow">Auto Wallstein · Verwaltung</p>
        <h1>Willkommen zurück.</h1>
        <p class="text-muted mb-4">Melden Sie sich an, um Fahrzeuge, Anfragen und Website-Inhalte zu verwalten.</p>
        {% if form.errors %}<div class="alert alert-danger" role="alert">Bitte überprüfen Sie Benutzername und Passwort.</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 mt-3">Anmelden</button>
        </form>
        <a class="login-back" href="{% url 'home' %}">Zur Website</a>
    </main>
</body>
</html>
